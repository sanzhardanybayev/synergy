<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M9.5 3.4 15.6 9.5 9.5 15.6 3.4 9.5Z' fill='%23e0784f'/%3E%3Cpath d='M14.5 8.9 20.1 14.5 14.5 20.1 8.9 14.5Z' fill='none' stroke='%238d8578' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Synergy</title>
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong
      // theme. "system" (no stored preference) is resolved to a concrete
      // light/dark value and kept live via the matchMedia listener; the CSS
      // only ever sees data-theme="light" | "dark".
      (() => {
        const KEY = 'synergy-theme';
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const apply = () => {
          let stored = null;
          try {
            stored = localStorage.getItem(KEY);
          } catch {}
          const theme =
            stored === 'light' || stored === 'dark' ? stored : mq.matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        };
        apply();
        mq.addEventListener('change', apply);
        window.__synergyApplyTheme = apply;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
